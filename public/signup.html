<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artovex - Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Catamaran:wght@600;700;800;900&family=Rubik:wght@400;500;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body class="bg-dark auth-page">

  <main>
   <section class="auth-wrapper">
  <div class="auth-card">
        <a class="auth-logo" href="/">
          <ion-icon name="brush-sharp" aria-hidden="true"></ion-icon>
          <span>Artovex</span>
        </a>

        <h1 class="auth-title">Create your account</h1>
        <p class="auth-subtitle">Upload and share your digital art with the world.</p>

        <form action="/signup" method="post" class="auth-form">
          <label class="auth-label" for="signup-name">Full name</label>
          <input id="signup-name" type="text" name="name" class="auth-input" placeholder="Jane Doe" required>

          <label class="auth-label" for="signup-email">Email</label>
          <input id="signup-email" type="email" name="email" class="auth-input" placeholder="jane@artovex.com" required>

          <label class="auth-label" for="signup-password">Password</label>
          <input id="signup-password" type="password" name="password" class="auth-input" placeholder="Create a password"
            required>

      <button type="submit" class="btn btn-primary auth-btn">Sign Up</button>
    </form>

    <p class="auth-footer">
      Already have an account?
      <a href="/login">Login</a>
    </p>
  </div>
</section>
  </main>

  <script type="module"
    src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule
    src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

</body>
</html>
