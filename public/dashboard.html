<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artovex Dashboard - Upload Artworks</title>

  <link rel="stylesheet" href="./assets/css/style.css" />

  <!-- Google Fonts (same as index) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Catamaran:wght@600;700;800;900&family=Rubik:wght@400;500;800&display=swap"
    rel="stylesheet">
</head>

<body class="bg-dark dashboard-body">

  <main>
    <section class="section dashboard-section">
      <div class="container dashboard-container">

        <!-- Top bar -->
        <header class="dashboard-header">
          <div class="dashboard-heading">
            <p class="section-subtitle">Creator tools</p>
            <h1 class="h2 section-title">Artovex Dashboard</h1>
            <p class="section-text">
              Upload new artworks, add descriptions, and keep the public gallery fresh.
            </p>
          </div>
          <a href="/logout" class="btn btn-secondary">Logout</a>
        </header>

        <div class="dashboard-content">
        <!-- Upload Form -->
          <div class="dashboard-card">
            <div class="dashboard-card__header">
              <div>
                <h2 class="h3">Upload new artwork</h2>
                <p class="card-helper">High-resolution JPG or PNG recommended.</p>
            </div>
            </div>

            <form id="upload-form" class="dashboard-form" enctype="multipart/form-data">
              <label for="title" class="dashboard-label">Title</label>
              <input type="text" id="title" name="title" class="dashboard-input" placeholder="Artwork title" required />

              <label for="description" class="dashboard-label">Description</label>
              <textarea id="description" name="description" class="dashboard-input" rows="4"
                placeholder="Short description (max 240 characters)"></textarea>

              <label for="category" class="dashboard-label">Category (optional)</label>
              <input type="text" id="category" name="category" class="dashboard-input"
                placeholder="Painting, Digital, Photography, etc." />

              <label for="image" class="dashboard-label file-label">
                <span>Artwork image</span>
              <input type="file" id="image" name="image" accept="image/*" required />
                <span class="file-hint">Drag & drop or click to choose a file</span>
              </label>

              <button type="submit" class="btn btn-primary dashboard-submit">
              Upload Artwork
            </button>

              <p id="upload-status" class="section-text upload-status" role="status" aria-live="polite"></p>
          </form>
        </div>

        <!-- Existing artworks (admin view) -->
          <div class="dashboard-card">
            <div class="dashboard-card__header">
              <div>
                <h2 class="h3">Current gallery artworks</h2>
                <p class="card-helper">Latest uploads appear first.</p>
              </div>
              <button type="button" class="btn-link refresh-btn" id="refresh-artwork">
                Refresh
              </button>
            </div>
            <div id="artwork-list" class="dashboard-grid" aria-live="polite">
            <!-- Filled by JS -->
            </div>
          </div>
        </div>

      </div>
    </section>
  </main>

  <script>
    // Load artworks for admin view
    async function loadArtworksAdmin() {
      const container = document.getElementById("artwork-list");
      if (!container) return;

      try {
        const res = await fetch("/api/artworks");
        if (!res.ok) throw new Error("Failed to load artworks");

        const artworks = await res.json();
        container.innerHTML = "";

        if (!artworks.length) {
          container.innerHTML = "<p class='card-helper'>No artworks yet.</p>";
          return;
        }

        artworks.slice().reverse().forEach((art) => {
          const div = document.createElement("article");
          div.className = "dashboard-card dashboard-card--compact";

          div.innerHTML = `
            <figure class="dashboard-thumb">
              <img src="${art.fileUrl}" alt="${art.title || "Artwork"}" loading="lazy" />
            </figure>
            <div class="dashboard-card__body">
              <h3 class="dashboard-card__title">
                ${art.title || "Untitled"}
              </h3>
              <p class="dashboard-card__description">
                ${art.description || ""}
              </p>
              <p class="dashboard-card__meta">
                ${art.category || "Uncategorized"}
              </p>
            </div>
          `;

          container.appendChild(div);
        });
      } catch (err) {
        console.error(err);
        container.innerHTML = "<p class='error-text'>Failed to load artworks.</p>";
      }
    }

    // Handle upload form submit
    const uploadForm = document.getElementById("upload-form");
    const uploadStatus = document.getElementById("upload-status");
    const refreshBtn = document.getElementById("refresh-artwork");

    if (uploadForm) {
      uploadForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        uploadStatus.textContent = "Uploading...";

        const formData = new FormData(uploadForm);

        try {
          const res = await fetch("/api/upload", {
            method: "POST",
            body: formData,
          });

          if (!res.ok) throw new Error("Upload failed");

          const data = await res.json();

          if (data.success) {
            uploadStatus.textContent = "Artwork uploaded successfully!";
            uploadForm.reset();
            loadArtworksAdmin(); // Refresh list
          } else {
            uploadStatus.textContent = "Upload failed. Please try again.";
          }
        } catch (err) {
          console.error(err);
          uploadStatus.textContent = "Error uploading artwork.";
        }
      });
    }

    if (refreshBtn) {
      refreshBtn.addEventListener("click", () => {
        refreshBtn.setAttribute("aria-busy", "true");
        loadArtworksAdmin().finally(() => refreshBtn.removeAttribute("aria-busy"));
      });
    }

    // Initial load
    window.addEventListener("DOMContentLoaded", loadArtworksAdmin);
  </script>
</body>
</html>
